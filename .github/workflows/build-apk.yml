name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Generate static web app
        run: npm run generate

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NecoManga.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NecoManga-APK
          path: NecoManga.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "NecoManga Latest APK"
          body: |
            ## 📱 NecoManga Android APK

            Свежая автоматическая сборка читалки NecoManga для Android.

            - **Файл:** `NecoManga.apk`
            - **Коммит:** ${{ github.sha }}

            ### 🚀 Установка:
            1. Скачайте файл **`NecoManga.apk`** ниже в блоке **Assets**.
            2. Откройте скачанный файл на вашем Android смартфоне или планшете.
            3. Если система предупредит об установке из неизвестных источников — разрешите установку для браузера/проводника.
            4. Приятного чтения манги без блокировок! 🎉
          draft: false
          prerelease: false
          files: NecoManga.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
