name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Generate static web app
        run: npm run generate
        env:
          VITE_APP_VERSION: "1.1.0"
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_APP_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersionName=1.1.${{ github.run_number }} --stacktrace

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NecoManga.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "NecoManga v1.1.0 (сборка #${{ github.run_number }})"
          body: |
            ## 📱 NecoManga Android APK v1.1.0

            Свежая автоматическая сборка читалки NecoManga для Android.

            - **Файл:** `NecoManga.apk`
            - **Сборка:** #${{ github.run_number }}
            - **Коммит:** `${{ github.sha }}`

            ### 🚀 Что нового:
            - Встроенное автообновление приложения прямо из интерфейса (в 1 клик)
            - Нативная загрузка глав манхвы и манги через фоновый перехватчик
            - Адаптированная мобильная верстка и нижняя панель навигации

            ### 📲 Установка:
            1. Скачайте файл **`NecoManga.apk`** ниже в блоке **Assets**.
            2. Откройте файл на Android-устройстве и нажмите «Установить» (или используйте обновление внутри приложения).
          draft: false
          prerelease: false
          files: NecoManga.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NecoManga-APK
          path: NecoManga.apk
          retention-days: 14
