name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Generate static web app
        run: npm run generate
        env:
          VITE_APP_VERSION: "1.2.0"
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_APP_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersionName=1.2.${{ github.run_number }} --stacktrace

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NecoManga.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "NecoManga v1.2.0 (сборка #${{ github.run_number }})"
          body: |
            ## 📱 NecoManga Android APK v1.2.0

            Свежая автоматическая сборка читалки NecoManga для Android.

            - **Файл:** `NecoManga.apk`
            - **Сборка:** #${{ github.run_number }}
            - **Версия:** `1.2.0`
            - **Коммит:** `${{ github.sha }}`

            ### 🚀 Что нового в v1.2.0:
            - 📖 **Режим Ранобэ (N.ECORANOBE):** быстрое переключение между каталогами Манги и Ранобэ/новелл кнопками `[R]` / `[M]` в шапке, читалка текстовых глав с выбором размера шрифта, тем оформления (тёмная, сепия, амолед) и межстрочного интервала.
            - 🔍 **Масштабирование страниц в читалке:** полноценный Pinch-to-zoom (зум двумя пальцами) от 1.0x до 4.5x, свободное перемещение (pan/drag) по увеличенной странице без случайного скролла и быстрый Double-tap для приближения до 2.5x.
            - 📋 **Контекстное меню при долгом нажатии:** при удержании пальца на странице манги (Long Press) открывается удобное меню с возможностью перезагрузить картинку (очистить кэш) или напрямую сохранить страницу в системную **Галерею** (альбом **NecoManga**).
            - 🎠 **Плавные аппаратные слайдеры (GPU):** все карусели на главной переведены на нативный аппаратный скролл 120 FPS с естественной мобильной инерцией, полным отсутствием скроллбаров, плавным перетаскиванием и стрелками навигации для ПК.
            - 🎨 **Компактный радиус карточек:** аккуратное скругление 8px (`rounded-lg`) на карточках тайтлов вместо чрезмерных 16px.
            - 🔖 **Надёжная история чтения:** сохранение всех прочитанных глав прямо во время чтения (при скролле, перелистывании и смене глав) с корректными отметками на странице тайтла.
            - 🔄 **Автообновление:** обновление приложения прямо внутри настроек в один клик.

            ### 📲 Установка и обновление:
            1. Скачайте файл **`NecoManga.apk`** ниже в блоке **Assets**.
            2. Откройте файл на Android-устройстве и нажмите «Установить» (или используйте кнопку «Проверить обновления» в приложении).
          draft: false
          prerelease: false
          files: NecoManga.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NecoManga-APK
          path: NecoManga.apk
          retention-days: 14
